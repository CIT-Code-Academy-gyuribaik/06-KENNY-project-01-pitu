<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:dark}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body><title>열 폭의 먹선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@300;400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0A0908;
  --field:#0C0A09;
  --edge:#2A241D;
  --edge2:#4A4136;
  --hanji:#EAE1CD;
  --hanji-2:#A2977F;
  --hanji-3:#6E6555;
  --seal:#D0432F;
  --gold:#C9A227;
  --celadon:#7FB3A3;
  --disp:'Song Myung',"Nanum Myeongjo",serif;
  --ui:'IBM Plex Sans KR',"Malgun Gothic",system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--hanji);
  font-family:var(--ui);font-weight:300;
  -webkit-font-smoothing:antialiased;
}
.stage{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:16px 14px 22px;
}
.rig{
  width:min(100%, max(290px, min(640px, calc(100vh - 208px))));
  display:flex;flex-direction:column;gap:11px;
}

/* ── HUD ── */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:flex-end;gap:14px;min-height:44px}
.hud-l{display:flex;align-items:baseline;gap:9px;min-width:0}
.hud-l .no{font-family:var(--disp);font-size:26px;line-height:1;color:var(--gold)}
.hud-l .nm{font-family:var(--disp);font-size:19px;line-height:1;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-l .tag{font-family:var(--disp);font-size:11px;color:var(--hanji-3);letter-spacing:.14em}
.hud-c{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:180px}
.hud-c .lab{font-size:10px;letter-spacing:.22em;color:var(--hanji-3)}
.hud-c .clock{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.hud-c .inv{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--gold);min-height:13px;line-height:13px;font-variant-numeric:tabular-nums}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hud-r .row{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.16em;color:var(--hanji-3)}
.hud-r .row b{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--hanji-2);font-variant-numeric:tabular-nums}
.ki{width:86px;height:3px;background:#231E18;overflow:hidden}
.ki i{display:block;height:100%;width:0;background:var(--celadon)}
.ki.full i{background:var(--gold)}
.bar{width:100%;height:2px;background:#231E18;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--hanji-2)}

/* ── 폭 ── */
.fieldwrap{position:relative;padding:6px;border:1px solid var(--edge);background:#0E0C0A}
canvas#field{display:block;width:100%;height:auto;aspect-ratio:1/1;border:1px solid #201B16;background:var(--field);touch-action:none}

/* ── 겹장 ── */
.overlay{
  position:absolute;inset:7px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:28px 26px;
  background:rgba(9,8,7,.86);text-align:center;overflow:auto;
}
.overlay[hidden]{display:none}
.overlay.list{justify-content:flex-start;gap:12px;padding:20px 18px}
.eyebrow{font-size:10px;letter-spacing:.34em;color:var(--hanji-3);margin:0}
.title{font-family:var(--disp);font-size:clamp(30px,7.4vw,50px);line-height:1.08;margin:0;letter-spacing:.05em;text-wrap:balance}
.title .dim{color:var(--hanji-3)}
.subtitle{font-family:var(--disp);font-size:14px;color:var(--gold);letter-spacing:.3em;margin:0}
.lede{max-width:34em;font-size:13px;line-height:1.85;color:var(--hanji-2);margin:0}
.lede em{font-style:normal;color:var(--hanji)}
.big{font-family:var(--disp);font-size:clamp(24px,6vw,36px);margin:0;letter-spacing:.04em}
.big.red{color:var(--seal)}
.big.gold{color:var(--gold)}
.stat{display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:9px;letter-spacing:.24em;color:var(--hanji-3)}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.row-btn{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.btn{
  font-family:var(--ui);font-size:13px;font-weight:400;letter-spacing:.1em;
  color:var(--hanji);background:transparent;border:1px solid var(--edge2);
  padding:10px 22px;cursor:pointer;transition:border-color .16s,background .16s,color .16s;
}
.btn:hover{border-color:var(--seal);background:rgba(208,67,47,.09)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.ghost{border-color:#332C23;color:var(--hanji-2);padding:9px 16px;font-size:12px}
.btn.ghost:hover{color:var(--hanji)}
.keyline{font-size:11px;line-height:2.1;color:var(--hanji-3);letter-spacing:.03em;margin:0}
.keyline kbd{
  font-family:var(--mono);font-size:10.5px;color:var(--hanji-2);
  border:1px solid #322B23;padding:2px 6px;margin:0 2px;background:#141110;
}

/* ── 폭 목록 ── */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:100%}
.card{
  display:flex;align-items:baseline;gap:9px;padding:11px 12px;width:100%;
  border:1px solid #2B251E;background:rgba(22,19,15,.75);text-align:left;
  font-family:var(--ui);color:var(--hanji);cursor:pointer;transition:border-color .15s,background .15s;
}
.card:hover:not(:disabled){border-color:var(--gold);background:rgba(201,162,39,.07)}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.card:disabled{opacity:.32;cursor:not-allowed}
.card .no{font-family:var(--disp);font-size:17px;line-height:1;color:var(--gold);width:1.2em}
.card .nm{font-family:var(--disp);font-size:14px;line-height:1}
.card .rec{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--hanji-3);letter-spacing:.04em;white-space:nowrap}
.card .rec.done{color:var(--celadon)}
.hint{font-size:11.5px;line-height:1.7;color:var(--hanji-2);max-width:30em;margin:0}
.hint b{font-weight:400;color:var(--hanji)}

/* ── 폭 이름 ── */
.flash{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;pointer-events:none;opacity:0;
}
.flash.on{animation:flashOut 2.2s ease-out forwards}
.flash .fno{font-family:var(--disp);font-size:52px;color:var(--gold);line-height:1}
.flash .fnm{font-family:var(--disp);font-size:24px;letter-spacing:.16em}
.flash .fhint{font-size:11.5px;color:var(--hanji-2)}
@keyframes flashOut{0%{opacity:0}14%{opacity:1}62%{opacity:1}100%{opacity:0}}

/* ── 아래 ── */
.foot{
  width:min(100%, max(290px, min(640px, calc(100vh - 208px))));
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-size:10.5px;letter-spacing:.09em;color:var(--hanji-3);
}
.foot span{white-space:nowrap}
.foot b{font-family:var(--mono);font-weight:400;color:var(--hanji-2)}

@media (max-width:430px){
  .hud-c{min-width:112px}
  .hud-l .tag{display:none}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .flash.on{animation:none;opacity:1}
}
</style>

<div class="stage">
  <div class="rig">
    <div class="hud">
      <div class="hud-l">
        <span class="no" id="hNo">一</span>
        <span class="nm" id="hNm">낙수</span>
        <span class="tag" id="hTag">落水</span>
      </div>
      <div class="hud-c">
        <span class="lab">남은 시간</span>
        <span class="clock" id="hClock">22.0</span>
        <div class="bar"><i id="hBar"></i></div>
        <span class="inv" id="hInv"></span>
      </div>
      <div class="hud-r">
        <div class="row"><span>죽음</span><b id="hDeath">0</b></div>
      </div>
    </div>

    <div class="fieldwrap">
      <canvas id="field" width="640" height="640" aria-label="먹선 회피 게임 화면"></canvas>
      <div class="flash" id="flash" aria-hidden="true">
        <span class="fno"></span><span class="fnm"></span><span class="fhint"></span>
      </div>
      <div class="overlay" id="ov"></div>
    </div>
  </div>

  <div class="foot">
    <span><b>&#8592;&#8593;&#8594;&#8595;</b> 이동 &nbsp; <b>Shift</b> 정밀 &nbsp; <b>Space</b> 무적 대쉬</span>
    <span><b>P</b> 멈춤 &nbsp; <b>R</b> 다시 &nbsp; <b>Esc</b> 목록</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* ───── 무대 ───── */
var W=640,H=640;
var cv=document.getElementById('field');
var ctx=cv.getContext('2d');
var dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
ctx.setTransform(dpr,0,0,dpr,0,0);
var REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 한지 결 + 사방 어둠 — 한 번만 굽는다 */
var paper=(function(){
  var c=document.createElement('canvas'); c.width=W; c.height=H;
  var g=c.getContext('2d');
  var im=g.createImageData(W,H), d=im.data;
  for(var i=0;i<d.length;i+=4){
    var v=180+Math.random()*70;
    d[i]=v; d[i+1]=v-10; d[i+2]=v-30;
    d[i+3]=Math.random()<0.55?0:11;
  }
  g.putImageData(im,0,0);
  var vg=g.createRadialGradient(W/2,H/2,W*0.30,W/2,H/2,W*0.80);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.58)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
  return c;
})();

/* ───── 열 폭 ───── */
var LEVELS=[
 {no:'一',name:'낙수',tag:'落水',hint:'하늘에서 먹이 떨어진다. 아래를 넓게 쓰라.',dur:22,hue:'#6FA8C7'},
 {no:'二',name:'소나기',tag:'驟雨',hint:'바람이 천천히 방향을 바꾼다. 틈도 같이 흐른다.',dur:24,hue:'#A9C0CE'},
 {no:'三',name:'물레',tag:'紡車',hint:'중심에서 붓이 돈다. 갈수록 빨라진다.',dur:26,hue:'#D8A93F'},
 {no:'四',name:'십자바람',tag:'十字風',hint:'네 변에서 한 줄씩. 틈은 언제나 하나뿐.',dur:26,hue:'#7FB3A3'},
 {no:'五',name:'협곡',tag:'峽谷',hint:'벽이 내려온다. 틈을 먼저 보고 움직여라.',dur:28,hue:'#C08A5E'},
 {no:'六',name:'그림자',tag:'影',hint:'따라온다. 맞서지 말고 크게 돌아라.',dur:28,hue:'#9C8AB8'},
 {no:'七',name:'파문',tag:'波紋',hint:'원이 퍼진다. 안쪽이 더 안전할 때가 있다.',dur:30,hue:'#5FA8B8'},
 {no:'八',name:'역류',tag:'逆流',hint:'중력이 뒤집힌다. 오른쪽 눈금을 보라.',dur:30,hue:'#C9A227'},
 {no:'九',name:'소용돌이',tag:'渦',hint:'나선에도 규칙이 있다. 규칙을 읽어라.',dur:32,hue:'#D46A6A'},
 {no:'十',name:'무명',tag:'無明',hint:'앞의 아홉 폭이 여덟 초마다 갈아탄다.',dur:40,hue:'#EDE1C6'}
];

/* ───── 저장 ───── */
var KEY='meokseon.v1';
var DB={unlocked:1,best:{},clears:0};
try{
  var raw=localStorage.getItem(KEY);
  if(raw){ var o=JSON.parse(raw);
    if(o&&typeof o==='object'){ DB.unlocked=o.unlocked||1; DB.best=o.best||{}; DB.clears=o.clears||0; }
  }
}catch(e){}
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){} }

/* ───── 상태 ───── */
/* 대쉬: 0.15초 동안 152px를 무적으로 관통한다 */
var DASH_TIME=0.15, DASH_DIST=152, DASH_SPD=DASH_DIST/DASH_TIME, DASH_TAIL=0.10;
var START_INV=3.0;

var G={screen:'title',i:0,t:0,dur:22,deaths:0,lvlDeaths:0,
       inv:0,dash:0,dx:0,dy:-1,ghostT:0,shake:0,grazeN:0};
var PL={x:W/2,y:H*0.80,r:4.6,ang:0,fx:0,fy:-1};
var ents=[], parts=[], ghosts=[], S={};
var C=tint('#EAE1CD');

function tint(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  function f(a){ return 'rgba('+r+','+g+','+b+','+a+')'; }
  return {core:f(.94),bleed:f(.13),line:f(.80),wall:f(.72),glow:f(.055)};
}

/* ───── 붓 ───── */
function dot(x,y,vx,vy,r,tag){ if(ents.length>920)return; ents.push({k:0,x:x,y:y,vx:vx,vy:vy,r:r,tag:tag||''}); }
function ring(x,y,spd,rMax){ ents.push({k:1,x:x,y:y,r:6,spd:spd,rMax:rMax,th:11}); }
function wall(x,y,w,h,vy){ ents.push({k:2,x:x,y:y,w:w,h:h,vy:vy}); }
function chaser(x,y){ ents.push({k:3,x:x,y:y,vx:0,vy:0,r:12,spd:118,acc:255,trail:[]}); }
function blade(cx,cy,r0,len,w,ang,om){ ents.push({k:4,cx:cx,cy:cy,r0:r0,len:len,w:w,ang:ang,om:om}); }
function shake(v){ if(!REDUCED&&v>G.shake) G.shake=v; }

/* ───── 열 가지 필법 ───── */
var Pat={
 rain:function(dt,t,k){
   S.a0=(S.a0||0)+dt;
   var iv=Math.max(0.085,(0.30-t*0.0066)/k);
   while(S.a0>=iv){ S.a0-=iv;
     dot(18+Math.random()*(W-36),-14,(Math.random()*2-1)*38,168+t*4.6+Math.random()*72,6+Math.random()*6);
   }
   S.b0=(S.b0||0)+dt;
   if(S.b0>5.2){ S.b0=0;
     var gap=64+Math.random()*(W-128);
     for(var x=14;x<W;x+=33){ if(Math.abs(x-gap)<56) continue; dot(x,-20,0,214+t*4,8); }
   }
 },
 drizzle:function(dt,t,k){
   var wind=Math.sin(t*0.55)*152;
   S.a1=(S.a1||0)+dt;
   var iv=Math.max(0.034,(0.115-t*0.0019)/k);
   while(S.a1>=iv){ S.a1-=iv;
     dot(-50+Math.random()*(W+100),-12,wind,300+Math.random()*112,4+Math.random()*2.6);
   }
   S.b1=(S.b1||0)+dt;
   if(S.b1>3.4){ S.b1=0;
     var gap=72+Math.random()*(W-144);
     for(var x=-140;x<W+140;x+=29){ if(Math.abs(x-gap)<50) continue; dot(x,-22,wind*1.45,362,5); }
   }
 },
 wheel:function(dt,t,k){
   if(!S.w2){ S.w2=1;
     for(var i=0;i<4;i++) blade(W/2,H/2,46,206,13,i*Math.PI/2,0.86);
     for(var j=0;j<3;j++) blade(W/2,H/2,262,148,10,j*2.0944+0.4,-0.73);
   }
   for(var m=0;m<ents.length;m++) if(ents[m].k===4) ents[m].om*=(1+0.021*dt);
   S.a2=(S.a2||0)+dt;
   var iv=0.60/k;
   while(S.a2>=iv){ S.a2-=iv;
     S.sp2=(S.sp2||0)+0.72;
     for(var n=0;n<5;n++){ var a=S.sp2+n*1.2566;
       dot(W/2+Math.cos(a)*26,H/2+Math.sin(a)*26,Math.cos(a)*126,Math.sin(a)*126,6);
     }
   }
 },
 cross:function(dt,t,k){
   S.a3=(S.a3||0)+dt;
   var iv=Math.max(0.42,(0.95-t*0.0115)/k);
   while(S.a3>=iv){ S.a3-=iv;
     S.side=((S.side||0)+1)%4;
     var spd=206+t*4.3, gap=76+Math.random()*(W-152), gw=50;
     for(var p=10;p<W;p+=26){
       if(Math.abs(p-gap)<gw) continue;
       if(S.side===0) dot(-12,p,spd,0,6);
       else if(S.side===1) dot(W+12,p,-spd,0,6);
       else if(S.side===2) dot(p,-12,0,spd,6);
       else dot(p,H+12,0,-spd,6);
     }
   }
 },
 canyon:function(dt,t,k){
   S.a4=(S.a4||0)+dt;
   var iv=Math.max(0.76,(1.55-t*0.021)/k);
   while(S.a4>=iv){ S.a4-=iv;
     var gw=Math.max(64,116-t*1.55);
     var gx=gw/2+16+Math.random()*(W-gw-32);
     var sp=156+t*5.3, h=24;
     wall(0,-h,Math.max(0,gx-gw/2),h,sp);
     wall(gx+gw/2,-h,Math.max(0,W-(gx+gw/2)),h,sp);
   }
   S.b4=(S.b4||0)+dt;
   if(S.b4>0.55){ S.b4=0; dot(18+Math.random()*(W-36),H+12,0,-(92+t*2.1),7); }
 },
 shadow:function(dt,t,k){
   if(S.t5===undefined){ S.t5=1.3; S.n5=0; }
   if(t>S.t5&&S.n5<4){ S.n5++; S.t5=t+6.4;
     var cs=[[32,32],[W-32,32],[32,H-32],[W-32,H-32]];
     var best=cs[0],bd=-1;
     for(var i=0;i<cs.length;i++){
       var d=Math.hypot(cs[i][0]-PL.x,cs[i][1]-PL.y);
       if(d>bd){ bd=d; best=cs[i]; }
     }
     chaser(best[0],best[1]);
   }
   for(var m=0;m<ents.length;m++) if(ents[m].k===3) ents[m].spd=118+t*2.4;
   S.a5=(S.a5||0)+dt;
   var iv=0.34/k;
   while(S.a5>=iv){ S.a5-=iv; dot(16+Math.random()*(W-32),-12,0,152+t*3.1,7); }
 },
 ripple:function(dt,t,k){
   S.a6=(S.a6||0)+dt;
   var iv=Math.max(0.70,(1.05-t*0.0145)/k);
   while(S.a6>=iv){ S.a6-=iv;
     var x,y;
     if(Math.random()<0.45){
       var a=Math.random()*6.283, d=108+Math.random()*70;
       x=PL.x+Math.cos(a)*d; y=PL.y+Math.sin(a)*d;
     } else { x=56+Math.random()*(W-112); y=56+Math.random()*(H-112); }
     x=Math.max(22,Math.min(W-22,x)); y=Math.max(22,Math.min(H-22,y));
     ring(x,y,128+t*3.5,224+Math.random()*156);
   }
 },
 reflux:function(dt,t,k){
   if(S.d7===undefined){ S.d7=1; S.f7=0; }
   var period=Math.max(2.2,3.6-t*0.031);
   S.f7+=dt;
   if(S.f7>period){ S.f7=0; S.d7*=-1; shake(7);
     for(var i=0;i<ents.length;i++){ var e=ents[i]; if(e.k===0&&e.tag==='g') e.vy=-e.vy; }
   }
   S.gauge=1-S.f7/period;
   S.a7=(S.a7||0)+dt;
   var iv=Math.max(0.072,(0.20-t*0.0031)/k);
   while(S.a7>=iv){ S.a7-=iv;
     var x=16+Math.random()*(W-32), v=176+t*3.3+Math.random()*52;
     if(S.d7>0) dot(x,-12,0,v,6,'g'); else dot(x,H+12,0,-v,6,'g');
   }
   S.b7=(S.b7||0)+dt;
   if(S.b7>2.1){ S.b7=0;
     var left=Math.random()<0.5, gap=68+Math.random()*(H-136);
     for(var y=12;y<H;y+=27){ if(Math.abs(y-gap)<56) continue;
       dot(left?-12:W+12,y,left?242:-242,0,5.5);
     }
   }
 },
 spiral:function(dt,t,k){
   if(!S.i8){ S.i8=1; S.ang8=0; blade(W/2,H/2,28,302,11,0,0.56); }
   S.ang8+=dt*(2.05+t*0.031);
   S.a8=(S.a8||0)+dt;
   var iv=0.075/k, arms=t>16?6:5;
   while(S.a8>=iv){ S.a8-=iv;
     for(var i=0;i<arms;i++){
       var a=S.ang8+i*6.2832/arms, sp=132+Math.random()*30;
       dot(W/2+Math.cos(a)*24,H/2+Math.sin(a)*24,Math.cos(a)*sp,Math.sin(a)*sp,5.5);
     }
   }
 },
 abyss:function(dt,t){
   var ph=Math.min(4,Math.floor(t/8));
   if(S.ph===undefined) S.ph=ph;
   if(ph!==S.ph){
     S.ph=ph; shake(10);
     var keep=[];
     for(var i=0;i<ents.length;i++){ var e=ents[i];
       if(e.k===0||e.k===1){ if(i%9===0) burst(e.x,e.y,1); } else keep.push(e);
     }
     ents=keep;
   }
   if(ph===0){ Pat.spiral(dt,t,0.70); Pat.rain(dt,t*0.5,0.50); }
   else if(ph===1){ Pat.ripple(dt,t-8,0.72); Pat.drizzle(dt,(t-8)*0.6,0.45); }
   else if(ph===2){ Pat.canyon(dt,t-16,0.85); Pat.shadow(dt,t-16,0.50); }
   else if(ph===3){ Pat.cross(dt,t-24,0.90); Pat.wheel(dt,t-24,0.50); }
   else { Pat.spiral(dt,t-32,0.85); Pat.ripple(dt,(t-32)*1.2,0.60); Pat.rain(dt,t-32,0.50); Pat.shadow(dt,t-32,0.35); }
 }
};

/* ───── 물리 ───── */
function updateEnts(dt){
  for(var i=ents.length-1;i>=0;i--){
    var e=ents[i];
    if(e.k===0){
      e.x+=e.vx*dt; e.y+=e.vy*dt;
      if(e.x<-70||e.x>W+70||e.y<-90||e.y>H+90) ents.splice(i,1);
    } else if(e.k===1){
      e.r+=e.spd*dt; if(e.r>e.rMax) ents.splice(i,1);
    } else if(e.k===2){
      e.y+=e.vy*dt; if(e.y>H+50) ents.splice(i,1);
    } else if(e.k===3){
      var dx=PL.x-e.x, dy=PL.y-e.y, d=Math.hypot(dx,dy)||1;
      e.vx+=(dx/d)*e.acc*dt; e.vy+=(dy/d)*e.acc*dt;
      var sp=Math.hypot(e.vx,e.vy);
      if(sp>e.spd){ e.vx=e.vx/sp*e.spd; e.vy=e.vy/sp*e.spd; }
      e.x+=e.vx*dt; e.y+=e.vy*dt;
      e.trail.push(e.x,e.y); if(e.trail.length>26) e.trail.splice(0,2);
    } else if(e.k===4){ e.ang+=e.om*dt; }
  }
}

function segDist(px,py,ax,ay,bx,by){
  var dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;
  var t=L?((px-ax)*dx+(py-ay)*dy)/L:0;
  t=t<0?0:(t>1?1:t);
  return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));
}

function collide(){
  var pr=PL.r, graze=0;
  for(var i=0;i<ents.length;i++){
    var e=ents[i];
    if(e.k===0||e.k===3){
      var d=Math.hypot(e.x-PL.x,e.y-PL.y);
      if(d<e.r+pr) return true;
      if(d<e.r+pr+18) graze++;
    } else if(e.k===1){
      var dr=Math.abs(Math.hypot(e.x-PL.x,e.y-PL.y)-e.r);
      if(dr<e.th*0.5+pr) return true;
      if(dr<e.th*0.5+pr+16) graze++;
    } else if(e.k===2){
      if(e.w<=0) continue;
      var cx=Math.max(e.x,Math.min(PL.x,e.x+e.w)), cy=Math.max(e.y,Math.min(PL.y,e.y+e.h));
      var dw=Math.hypot(PL.x-cx,PL.y-cy);
      if(dw<pr) return true;
      if(dw<pr+16) graze++;
    } else if(e.k===4){
      var c=Math.cos(e.ang), s=Math.sin(e.ang);
      var db=segDist(PL.x,PL.y,e.cx+c*e.r0,e.cy+s*e.r0,e.cx+c*(e.r0+e.len),e.cy+s*(e.r0+e.len));
      if(db<e.w*0.5+pr) return true;
      if(db<e.w*0.5+pr+16) graze++;
    }
  }
  G.grazeN=graze;
  return false;
}

  }
});

cv.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse') return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,t0:performance.now(),moved:0};
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});
cv.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id) return;
  var sc=W/cv.getBoundingClientRect().width;
  var ddx=e.clientX-drag.x, ddy=e.clientY-drag.y;
  PL.x+=ddx*sc; PL.y+=ddy*sc;
  var m=Math.hypot(ddx,ddy);
  drag.moved+=m;
  if(m>0.6){ PL.fx=ddx/m; PL.fy=ddy/m; }
  drag.x=e.clientX; drag.y=e.clientY;
  e.preventDefault();
});

function clearLevel(){
  var i=G.i, prev=DB.best[i];

  if(DB.unlocked<i+2) DB.unlocked=Math.min(LEVELS.length,i+2);
  if(i===LEVELS.length-1) DB.clears++;

  setScreen(i===LEVELS.length-1?'finale':'cleared');
}

function burst(x,y,n){
  for(var i=0;i<n;i++){

    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.55+Math.random()*0.5,age:0});
  }
}

var amb=[];
for(var ai=0;ai<48;ai++) amb.push({
  x:Math.random()*W,y:Math.random()*H,
  vx:(Math.random()*2-1)*11,vy:8+Math.random()*20,r:2+Math.random()*7
});
var ambAng=0;
function drawAmbient(dt){
  ambAng+=dt*0.12;
  ctx.fillStyle='rgba(234,225,205,0.10)';
  for(var i=0;i<amb.length;i++){
    var p=amb[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.y>H+12){ p.y=-12; p.x=Math.random()*W; }
    if(p.x<-12) p.x=W+12;
    if(p.x>W+12) p.x=-12;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill();
  }
  ctx.save();
  ctx.translate(W/2,H/2); ctx.rotate(ambAng);
  ctx.strokeStyle='rgba(201,162,39,0.10)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,208,0,4.4); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,262,2.2,5.0); ctx.stroke();

/* ───── 그리기 ───── */
function drawField(dt){
  ctx.save();
  if(G.shake>0.2) ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);

  ctx.fillStyle='#0C0A09'; ctx.fillRect(-26,-26,W+52,H+52);
  var glow=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,W*0.62);
  glow.addColorStop(0,C.glow); glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);

  if(G.screen==='title'||G.screen==='select'||G.screen==='finale') drawAmbient(dt);

  var i,e;
  /* 벽 */
  for(i=0;i<ents.length;i++){ e=ents[i]; if(e.k!==2||e.w<=0) continue;
    ctx.fillStyle=C.wall; ctx.fillRect(e.x,e.y,e.w,e.h);
    ctx.fillStyle='rgba(12,10,9,0.55)'; ctx.fillRect(e.x,e.y+e.h-3,e.w,3);
  }
  /* 파문 */
  ctx.lineWidth=11;
  for(i=0;i<ents.length;i++){ e=ents[i]; if(e.k!==1) continue;
    ctx.globalAlpha=0.30+(1-e.r/e.rMax)*0.55;
    ctx.strokeStyle=C.line;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,6.2832); ctx.stroke();
  }
  ctx.globalAlpha=1;
  /* 붓날 */
  ctx.lineCap='round';
  for(i=0;i<ents.length;i++){ e=ents[i]; if(e.k!==4) continue;
    var c=Math.cos(e.ang), s=Math.sin(e.ang);
    var ax=e.cx+c*e.r0, ay=e.cy+s*e.r0, bx=e.cx+c*(e.r0+e.len), by=e.cy+s*(e.r0+e.len);
    ctx.strokeStyle=C.bleed; ctx.lineWidth=e.w+13;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    ctx.strokeStyle=C.core; ctx.lineWidth=e.w;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  /* 먹점 — 번짐 */
  ctx.fillStyle=C.bleed; ctx.beginPath();
  for(i=0;i<ents.length;i++){ e=ents[i]; if(e.k!==0) continue;
    ctx.moveTo(e.x+e.r*2.05,e.y); ctx.arc(e.x,e.y,e.r*2.05,0,6.2832);
  }
  ctx.fill();
  /* 먹점 — 심 */
  ctx.fillStyle=C.core; ctx.beginPath();
  for(i=0;i<ents.length;i++){ e=ents[i]; if(e.k!==0) continue;
    ctx.moveTo(e.x+e.r,e.y); ctx.arc(e.x,e.y,e.r,0,6.2832);
  }
  ctx.fill();
  /* 그림자 */
  for(i=0;i<ents.length;i++){ e=ents[i]; if(e.k!==3) continue;
    if(e.trail.length>3){
      ctx.strokeStyle='rgba(156,138,184,0.22)'; ctx.lineWidth=9;
      ctx.beginPath(); ctx.moveTo(e.trail[0],e.trail[1]);
      for(var j=2;j<e.trail.length;j+=2) ctx.lineTo(e.trail[j],e.trail[j+1]);
      ctx.stroke();
    }
    ctx.fillStyle='rgba(20,16,26,0.92)';
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r+5,0,6.2832); ctx.fill();
    ctx.strokeStyle=C.core; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,6.2832); ctx.stroke();
    ctx.fillStyle='rgba(234,225,205,0.55)';
    ctx.beginPath(); ctx.arc(e.x,e.y,2.4,0,6.2832); ctx.fill();
  }

  /* 역류 눈금 */
  if(S.gauge!==undefined&&(G.screen==='play'||G.screen==='pause')){
    var gy=H*0.5, gh=150;
    ctx.strokeStyle='rgba(234,225,205,0.14)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(W-14,gy-gh/2); ctx.lineTo(W-14,gy+gh/2); ctx.stroke();
    ctx.strokeStyle=C.core; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(W-14,gy+gh/2); ctx.lineTo(W-14,gy+gh/2-gh*S.gauge); ctx.stroke();
    var dir=S.d7>0?1:-1;
    ctx.fillStyle=C.core; ctx.beginPath();
    ctx.moveTo(W-14,gy+dir*(gh/2+16));
    ctx.lineTo(W-21,gy+dir*(gh/2+5));
    ctx.lineTo(W-7,gy+dir*(gh/2+5));
    ctx.closePath(); ctx.fill();
  }

  /* 파편 */
  for(i=0;i<parts.length;i++){
    var pp=parts[i];
    ctx.globalAlpha=Math.max(0,1-pp.age/pp.life);
    ctx.fillStyle='#D0432F';
    ctx.fillRect(pp.x-1.7,pp.y-1.7,3.4,3.4);
  }
  ctx.globalAlpha=1;

  /* 대쉬 잔상 */
  for(i=0;i<ghosts.length;i++){
    var gh=ghosts[i], ga=1-gh.age/0.30;
    ctx.save();
    ctx.translate(gh.x,gh.y); ctx.rotate(gh.ang);
    ctx.globalAlpha=ga*0.45;
    ctx.fillStyle='#D0432F'; ctx.fillRect(-7,-7,14,14);
    ctx.globalAlpha=ga*0.7;
    ctx.strokeStyle='#C9A227'; ctx.lineWidth=1;
    ctx.strokeRect(-7.5,-7.5,15,15);
    ctx.restore();
  }
  ctx.globalAlpha=1;

  /* 낙관 */
  if(G.screen==='play'||G.screen==='pause'){
    var precise=!!(keys.ShiftLeft||keys.ShiftRight);
    ctx.save();
    ctx.translate(PL.x,PL.y); ctx.rotate(PL.ang);
    ctx.fillStyle='rgba(208,67,47,0.16)'; ctx.fillRect(-14,-14,28,28);
    ctx.fillStyle='#D0432F'; ctx.fillRect(-8,-8,16,16);
    ctx.strokeStyle='rgba(201,162,39,0.75)'; ctx.lineWidth=1;
    ctx.strokeRect(-8.5,-8.5,17,17);
    ctx.fillStyle='rgba(12,10,9,0.55)'; ctx.fillRect(-4.5,-1,9,2);
    ctx.restore();
    if(precise){
      ctx.strokeStyle='rgba(255,246,232,0.75)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(PL.x,PL.y,PL.r+2.5,0,6.2832); ctx.stroke();
    }
    ctx.fillStyle='#FFF6E8';
    ctx.beginPath(); ctx.arc(PL.x,PL.y,2.5,0,6.2832); ctx.fill();

    /* 무적 */
    if(G.inv>0){
      var pulse=REDUCED?0.5:0.38+0.24*Math.sin(performance.now()/85);
      ctx.strokeStyle='rgba(255,246,232,'+pulse.toFixed(3)+')';
      ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(PL.x,PL.y,15,0,6.2832); ctx.stroke();
      if(G.inv>0.35){
        ctx.strokeStyle='rgba(201,162,39,0.40)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(PL.x,PL.y,17+G.inv*26,0,6.2832); ctx.stroke();
        ctx.strokeStyle='rgba(201,162,39,0.14)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(PL.x,PL.y,17+START_INV*26,0,6.2832); ctx.stroke();
      }
    }
  }

  ctx.restore();
  ctx.drawImage(paper,0,0,W,H);
}

/* ───── 루프 ───── */
var last=performance.now(), acc=0;
var STEP=1/120;

function step(dt){
  var mx=0,my=0;
  if(keys.ArrowLeft||keys.KeyA) mx-=1;
  if(keys.ArrowRight||keys.KeyD) mx+=1;
  if(keys.ArrowUp||keys.KeyW) my-=1;
  if(keys.ArrowDown||keys.KeyS) my+=1;
  if(mx||my){ var n=Math.hypot(mx,my); PL.fx=mx/n; PL.fy=my/n; }

  if(G.dash>0){
    G.dash-=dt;
    PL.x+=G.dx*DASH_SPD*dt; PL.y+=G.dy*DASH_SPD*dt;
    G.ghostT+=dt;
    if(G.ghostT>0.016){ G.ghostT=0; ghosts.push({x:PL.x,y:PL.y,ang:PL.ang,age:0}); }
    PL.ang+=dt*7;
  } else {
    if(mx&&my){ mx*=0.7071; my*=0.7071; }
    var spd=(keys.ShiftLeft||keys.ShiftRight)?104:226;
    PL.x+=mx*spd*dt; PL.y+=my*spd*dt;
    PL.ang+=dt*0.55;
  }
  var pad=9;
  PL.x=Math.max(pad,Math.min(W-pad,PL.x));
  PL.y=Math.max(pad,Math.min(H-pad,PL.y));

  ORDER[G.i](dt,G.t,1);
  updateEnts(dt);

  if(G.inv>0){
    G.inv-=dt;
    G.grazeN=0;
  } else if(collide()){ die(); return; }

  G.t+=dt;
  if(G.t>=G.dur){ G.t=G.dur; clearLevel(); return; }
}

function loop(now){
  var dt=(now-last)/1000; last=now;
  if(dt>0.25) dt=0.25;

  if(G.screen==='play'){
    if(dashPressed){
      dashPressed=false;
      if(G.dash<=0){
        G.dash=DASH_TIME;
        G.dx=PL.fx; G.dy=PL.fy;
        if(G.inv<DASH_TIME+DASH_TAIL) G.inv=DASH_TIME+DASH_TAIL;
        ghosts.push({x:PL.x,y:PL.y,ang:PL.ang,age:0});
        shake(3);
      }
    }
    acc+=dt;
    var guard=0;
    while(acc>=STEP&&G.screen==='play'&&guard<40){ acc-=STEP; step(STEP); guard++; }
    if(acc>STEP*40) acc=0;
    hClock.textContent=Math.max(0,G.dur-G.t).toFixed(1);
    hBar.style.width=(G.t/G.dur*100).toFixed(2)+'%';
    hDeath.textContent=G.deaths;
    hInv.textContent=G.inv>0.05?'무적 '+G.inv.toFixed(1):'';
  } else {
    dashPressed=false; acc=0;
    if(hInv.textContent) hInv.textContent='';
  }

  for(var gi=ghosts.length-1;gi>=0;gi--){
    ghosts[gi].age+=dt;
    if(ghosts[gi].age>0.30) ghosts.splice(gi,1);
  }

  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i]; p.age+=dt;
    if(p.age>p.life){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=0.94; p.vy=p.vy*0.94+150*dt;
  }
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*46);

  drawField(dt);
  requestAnimationFrame(loop);
}

/* ───── 개막 ───── */
C=tint(LEVELS[0].hue);
hClock.textContent=LEVELS[0].dur.toFixed(1);
setScreen('title');
requestAnimationFrame(loop);
})();
</script>
